name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-aarch64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          package="issuecap-${GITHUB_REF_NAME}-${{ matrix.artifact }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$package" issuecap

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "issuecap-$env:GITHUB_REF_NAME-${{ matrix.artifact }}.zip"
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\issuecap.exe" `
            -DestinationPath $package

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: issuecap-*
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum issuecap-* > SHA256SUMS

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: IssueCapsule ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
