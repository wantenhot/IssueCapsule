[package]
name = "issuecapsule"
version = "0.1.0"
edition = "2024"
description = "Turn works on my machine into a reproducible bug"
license = "MIT"

[[bin]]
name = "issuecap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.8"
